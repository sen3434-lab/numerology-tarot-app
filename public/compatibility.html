<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OZ 넘버스 타로 · 궁합</title>
<link rel="stylesheet" href="/css/style.css"/>
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#bc6338"/>
<link rel="icon" href="/icons/icon-192.png"/>
<link rel="apple-touch-icon" href="/icons/icon-192.png"/>
<style>
  .hero { text-align: center; padding: 10px 0 22px; }
  .hero-eyebrow { font-size: 10.5px; letter-spacing: 5px; color: var(--primary); font-weight: 600; text-transform: uppercase; }
  .hero h1 { font-size: 20px; margin-top: 8px; }
  .hero p { color: var(--muted-foreground); font-size: 13px; margin-top: 8px; }
  .vs-row { display: flex; align-items: center; gap: 10px; }
  .vs-row .vs { font-size: 13px; color: var(--muted-foreground); flex-shrink: 0; }
  #resultBox { display: none; text-align: center; margin-top: 24px; }
  .score-box { margin-top: 20px; }
  .score-box .score-num { font-size: 40px; font-weight: 700; color: var(--primary-dark); line-height: 1; }
  .score-box .score-num small { font-size: 16px; font-weight: 500; }
  .score-box .badge { margin-top: 8px; }
</style>
</head>
<body>

<div class="topbar">
  <a href="/index.html" class="brand">OZ <span>✦</span> 넘버스 타로</a>
  <div class="topbar-actions">
    <a href="/coins.html" class="badge badge-free" id="coinBadge">🪙</a>
  </div>
</div>

<div class="container">

  <div id="loadingView" class="center" style="padding:60px 0;">
    <div class="spinner"></div>
  </div>

  <div id="gateView" style="display:none;" class="upsell-box">
    <div class="ic">💞</div>

  </div>

  <div id="mainView" style="display:none;">
    <div class="hero">
      <div class="hero-eyebrow">Compatibility</div>
      <h1>두 사람의 궁합을 볼까요?</h1>
      <p>등록하신 프로필 중 두 명을 골라주세요.</p>
    </div>

    <form id="compatForm">
      <div class="vs-row">
        <select id="profileA" class="field" style="flex:1;padding:12px 14px;border:0.8px solid var(--border);border-radius:8px;"></select>
        <span class="vs">&amp;</span>
        <select id="profileB" class="field" style="flex:1;padding:12px 14px;border:0.8px solid var(--border);border-radius:8px;"></select>
      </div>
      <button type="submit" class="btn btn-primary btn-block mt-16">궁합 보기</button>
    </form>

    <div id="resultBox">
      <div class="dual-card-grid">
        <div class="aspect-card">
          <div class="aspect-label" id="nameA"></div>
          <div class="card-num" id="numA"></div>
          <div class="card-name" id="cardNameA"></div>
        </div>
        <div class="aspect-card">
          <div class="aspect-label" id="nameB"></div>
          <div class="card-num" id="numB"></div>
          <div class="card-name" id="cardNameB"></div>
        </div>
      </div>

      <div id="compatGate" class="gate-box" style="display:none;"></div>

      <div id="compatContent" style="display:none;">
      <div class="score-box">
        <div class="score-num" id="scoreNum"></div>
        <span class="badge" id="scoreBadge"></span>
      </div>

      <div class="card mt-16" style="text-align:left;">
        <div class="section-label">궁합 리딩</div>
        <p id="summaryText" style="font-size:14px;line-height:1.8;"></p>
      </div>

      <div id="intimacyBox" style="display:none;">
        <div class="score-box">
          <div class="score-num" id="intimacyScoreNum"></div>
          <span class="badge" id="intimacyScoreBadge"></span>
        </div>
        <div class="card mt-16" style="text-align:left;">
          <div class="section-label">속궁합</div>
          <p id="intimacySummaryText" style="font-size:14px;line-height:1.8;"></p>
        </div>
      </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { requireAuth, getMember, getSb, renderBottomNav, showToast, renderHighlighted, claimFreeCoins, getBalance, getPrice, getCardTeaser } from '/js/app.js';
import { computeExternalNumber, computeInternalNumber } from '/js/numerology.js';

renderBottomNav('/compatibility.html');

const coinBadge = document.getElementById('coinBadge');
const compatGate = document.getElementById('compatGate');
const compatContent = document.getElementById('compatContent');

let profiles = [];
let balance = 0;
let price = 1;
let pair = null; // the pair currently on screen

function updateCoinBadge() {
  coinBadge.textContent = `🪙 ${balance}`;
}

async function init() {
  const session = await requireAuth();
  if (!session) return;

  const member = await getMember(session);
  if (!member) return;

  const claimed = await claimFreeCoins(session);
  balance = claimed ?? await getBalance();
  price = await getPrice('compatibility');
  updateCoinBadge();

  document.getElementById('loadingView').style.display = 'none';

  const sb = await getSb();
  const { data, error } = await sb
    .from('profiles')
    .select('*')
    .eq('member_id', session.user.id)
    .eq('app_key', 'numerology-tarot');

  if (error || !data || data.length < 2) {
    document.getElementById('gateView').innerHTML = `
      <div class="ic">💞</div>
      <p><strong>궁합을 보려면 프로필이 2명 이상 필요해요.</strong><br/>프로필 추가는 무료예요.</p>
      <a href="/profile-form.html" class="btn btn-primary mt-16">프로필 추가하기</a>
    `;
    document.getElementById('gateView').style.display = 'block';
    return;
  }

  profiles = data;
  const optionsHtml = profiles.map(p => `<option value="${p.id}">${p.name} (${p.relation})</option>`).join('');
  document.getElementById('profileA').innerHTML = optionsHtml;
  document.getElementById('profileB').innerHTML = optionsHtml;
  document.getElementById('profileB').selectedIndex = 1;

  document.getElementById('mainView').style.display = 'block';

  // 기록에서 들어오면 두 사람을 미리 골라 바로 보여준다 (이미 연 궁합은 무료).
  const q = new URLSearchParams(location.search);
  const qa = q.get('a'), qb = q.get('b');
  if (qa && qb && qa !== qb && profiles.some(p => String(p.id) === qa) && profiles.some(p => String(p.id) === qb)) {
    document.getElementById('profileA').value = qa;
    document.getElementById('profileB').value = qb;
    document.getElementById('compatForm').requestSubmit();
  }
}
init();

function scoreBadge(score, scoreNumEl, badgeEl) {
  if (score == null) {
    scoreNumEl.textContent = '';
    badgeEl.textContent = '점수 준비 중';
    badgeEl.className = 'badge badge-free';
    return;
  }
  scoreNumEl.innerHTML = `${score}<small>점</small>`;
  const [label, cls] = score >= 90 ? ['좋음', 'badge-active'] : score >= 80 ? ['보통', 'badge-student'] : ['별로', 'badge-free'];
  badgeEl.textContent = label;
  badgeEl.className = `badge ${cls}`;
}

// What the server hands back once the pair is opened (paid, or already paid).
function showOpened(data) {
  if (data.card_a_name) document.getElementById('cardNameA').textContent = data.card_a_name;
  if (data.card_b_name) document.getElementById('cardNameB').textContent = data.card_b_name;

  document.getElementById('summaryText').innerHTML = renderHighlighted(data.general?.summary_text) || '아직 이 조합의 궁합 해설이 등록되지 않았어요.';
  scoreBadge(data.general?.score, document.getElementById('scoreNum'), document.getElementById('scoreBadge'));

  const intimacyBox = document.getElementById('intimacyBox');
  if (data.romantic) {
    document.getElementById('intimacySummaryText').innerHTML = renderHighlighted(data.intimacy?.summary_text) || '아직 이 조합의 속궁합 해설이 등록되지 않았어요.';
    scoreBadge(data.intimacy?.score, document.getElementById('intimacyScoreNum'), document.getElementById('intimacyScoreBadge'));
    intimacyBox.style.display = 'block';
  } else {
    intimacyBox.style.display = 'none';
  }

  compatGate.style.display = 'none';
  compatContent.style.display = 'block';
}

function renderGate(note) {
  compatContent.style.display = 'none';
  compatGate.style.display = 'block';
  if (balance >= price) {
    compatGate.innerHTML = `
      <div class="gate-ic">🔓</div>
      <p><strong>코인 ${price}개로 두 사람의 궁합을 열어볼까요?</strong></p>
      <p class="muted small mt-8">지금 보유 <b>${balance}코인</b> · 한 번 열면 언제든 다시 볼 수 있어요</p>
      ${note ? `<p class="gate-err">${note}</p>` : ''}
      <button class="btn btn-primary btn-block mt-16" id="unlockCompat">궁합 열기 (${price}코인)</button>`;
    document.getElementById('unlockCompat').addEventListener('click', unlock);
  } else {
    compatGate.innerHTML = `
      <div class="gate-ic">🪙</div>
      <p><strong>코인이 부족해요</strong></p>
      <p class="muted small mt-8">보유 ${balance}코인 · 궁합을 열려면 ${price}코인이 필요해요<br/>충전하시거나, 내일 출석 보너스 1코인을 받아가세요.</p>
      <a href="/coins.html" class="btn btn-primary btn-block mt-16">코인 충전하기</a>`;
  }
}

function rpcArgs() {
  return { p_a: Number(pair.idA), p_b: Number(pair.idB), p_a_ext: pair.extA, p_b_ext: pair.extB, p_a_int: pair.intA, p_b_int: pair.intB };
}

async function unlock() {
  const btn = document.getElementById('unlockCompat');
  btn.disabled = true;
  btn.textContent = '여는 중...';
  const sb = await getSb();
  const { data, error } = await sb.rpc('numerology_unlock_compat', rpcArgs());
  if (error || !data) {
    console.error(error);
    renderGate('지금은 열지 못했어요. 코인은 차감되지 않았어요. 잠시 후 다시 시도해주세요.');
    return;
  }
  if (!data.ok) {
    if (typeof data.balance === 'number') { balance = data.balance; updateCoinBadge(); }
    renderGate(data.reason === 'insufficient_coins' ? '' : '지금은 열 수 없어요. 코인은 차감되지 않았어요.');
    return;
  }
  balance = data.balance ?? balance;
  updateCoinBadge();
  showOpened(data);
}

document.getElementById('compatForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const idA = document.getElementById('profileA').value;
  const idB = document.getElementById('profileB').value;
  if (idA === idB) {
    showToast('서로 다른 두 프로필을 선택해주세요.');
    return;
  }

  const profileA = profiles.find(p => String(p.id) === idA);
  const profileB = profiles.find(p => String(p.id) === idB);

  // Everyone is read on the full 21-card scale.
  const extA = computeExternalNumber(profileA, true);
  const extB = computeExternalNumber(profileB, true);
  const intA = computeInternalNumber(profileA, true);
  const intB = computeInternalNumber(profileB, true);
  if ([extA, extB, intA, intB].includes(null)) {
    showToast('생년월일 변환 지원 범위를 벗어난 프로필이 있어요.');
    return;
  }
  pair = { idA, idB, extA, extB, intA, intB };

  // Names, soul numbers and cards are free; score + reading are coins.
  const [cardA, cardB] = await Promise.all([getCardTeaser(extA), getCardTeaser(extB)]);
  document.getElementById('nameA').textContent = profileA.name;
  document.getElementById('numA').textContent = extA;
  document.getElementById('cardNameA').textContent = cardA.name || '(준비 중)';
  document.getElementById('nameB').textContent = profileB.name;
  document.getElementById('numB').textContent = extB;
  document.getElementById('cardNameB').textContent = cardB.name || '(준비 중)';
  document.getElementById('resultBox').style.display = 'block';

  const sb = await getSb();
  const { data: peek } = await sb.rpc('numerology_peek_compat', rpcArgs());
  if (peek?.ok) {
    showOpened(peek);
  } else {
    renderGate();
  }
});
</script>
</body>
</html>
