<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title id="pageTitle">OZ 넘버타로 · 프로필 추가</title>
<link rel="stylesheet" href="/css/style.css"/>
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#bc6338"/>
</head>
<body>

<div class="topbar">
  <a href="/index.html" class="brand">OZ <span>✦</span> 넘버타로</a>
  <div class="topbar-actions"></div>
</div>

<div class="container">
  <h1 id="formTitle" style="font-size:20px;margin-bottom:6px;">프로필 추가</h1>
  <p class="muted small mb-24" id="formSub">생년월일을 정확히 입력해주세요.</p>

  <form id="profileForm">
    <div class="field" id="relationField">
      <label>관계</label>
      <select id="relation">
        <option value="가족">가족</option>
        <option value="친구">친구</option>
        <option value="연인">연인</option>
        <option value="배우자">배우자</option>
        <option value="기타">기타</option>
      </select>
    </div>

    <div class="field">
      <label>이름</label>
      <input type="text" id="name" required placeholder="이름을 입력해주세요"/>
    </div>

    <div class="field">
      <label>양력 / 음력</label>
      <div class="radio-row">
        <label><input type="radio" name="isLunar" value="false" checked/> 양력</label>
        <label><input type="radio" name="isLunar" value="true"/> 음력</label>
      </div>
      <label class="mt-8" id="intercalationField" style="display:none;align-items:center;gap:6px;font-size:12.5px;font-weight:normal;color:var(--foreground);cursor:pointer;">
        <input type="checkbox" id="isIntercalation" style="width:auto;"/> 윤달이에요
      </label>
    </div>

    <div class="field">
      <label>생년월일</label>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">
        <input type="number" id="year" required placeholder="1990" min="1000" max="2050"/>
        <input type="number" id="month" required placeholder="월" min="1" max="12"/>
        <input type="number" id="day" required placeholder="일" min="1" max="31"/>
      </div>
      <p class="small muted mt-8" id="calendarHint">입력하신 양력 날짜를 기준으로 음력 성향도 함께 자동 변환해서 보여드려요.</p>
    </div>

    <div class="field">
      <label>성별</label>
      <div class="radio-row">
        <label><input type="radio" name="gender" value="남성" checked/> 남성</label>
        <label><input type="radio" name="gender" value="여성"/> 여성</label>
      </div>
    </div>

    <p class="err small" id="errMsg" style="display:none;color:var(--danger);"></p>

    <button type="submit" class="btn btn-primary btn-block mt-16" id="submitBtn">저장</button>
  </form>
</div>

<script type="module">
import { requireAuth, getSb, showToast } from '/js/app.js';

const params = new URLSearchParams(location.search);
const isFirst = params.get('first') === '1';
const editId = params.get('id');

if (isFirst) {
  document.getElementById('formTitle').textContent = '본인 정보 입력';
  document.getElementById('formSub').textContent = '먼저 본인의 생년월일을 입력해주세요. 본인 프로필은 무료로 이용하실 수 있어요.';
  document.getElementById('relationField').style.display = 'none';
} else if (editId) {
  document.getElementById('pageTitle').textContent = 'OZ 넘버타로 · 프로필 수정';
  document.getElementById('formTitle').textContent = '프로필 수정';
  document.getElementById('formSub').textContent = '정보를 수정해주세요.';
  document.getElementById('submitBtn').textContent = '수정';
}

let session = null;
let editingProfile = null;

function fillFormFromProfile(profile) {
  document.getElementById('name').value = profile.name;
  document.getElementById('year').value = Number(profile.birth_date.slice(0, 4));
  document.getElementById('month').value = Number(profile.birth_date.slice(5, 7));
  document.getElementById('day').value = Number(profile.birth_date.slice(8, 10));
  document.querySelector(`input[name="gender"][value="${profile.gender}"]`).checked = true;

  const isLunarRadio = document.querySelector(`input[name="isLunar"][value="${profile.is_lunar}"]`);
  if (isLunarRadio) isLunarRadio.checked = true;
  document.getElementById('isIntercalation').checked = !!profile.is_intercalation;
  document.querySelector('input[name="isLunar"]:checked').dispatchEvent(new Event('change'));

  if (profile.relation === '본인') {
    document.getElementById('relationField').style.display = 'none';
  } else {
    document.getElementById('relation').value = profile.relation;
  }
}

(async () => {
  session = await requireAuth();
  if (!session) return;

  if (editId) {
    const sb = await getSb();
    const { data, error } = await sb
      .from('profiles')
      .select('*')
      .eq('id', editId)
      .eq('member_id', session.user.id)
      .maybeSingle();
    if (error || !data) {
      showToast('프로필을 찾을 수 없어요.');
      window.location.href = '/index.html';
      return;
    }
    editingProfile = data;
    fillFormFromProfile(data);
  }
})();

const intercalationField = document.getElementById('intercalationField');
const calendarHint = document.getElementById('calendarHint');
document.querySelectorAll('input[name="isLunar"]').forEach((radio) => {
  radio.addEventListener('change', () => {
    const isLunar = document.querySelector('input[name="isLunar"]:checked').value === 'true';
    intercalationField.style.display = isLunar ? 'block' : 'none';
    calendarHint.textContent = isLunar
      ? '입력하신 음력 날짜를 기준으로 양력 성향도 함께 자동 변환해서 보여드려요.'
      : '입력하신 양력 날짜를 기준으로 음력 성향도 함께 자동 변환해서 보여드려요.';
  });
});

document.getElementById('profileForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!session) return;

  const errMsg = document.getElementById('errMsg');
  errMsg.style.display = 'none';
  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  submitBtn.textContent = '저장 중...';

  const name = document.getElementById('name').value.trim();
  const year = Number(document.getElementById('year').value);
  const month = Number(document.getElementById('month').value);
  const day = Number(document.getElementById('day').value);
  const gender = document.querySelector('input[name="gender"]:checked').value;
  const isSelf = isFirst || (editingProfile && editingProfile.relation === '본인');
  const relation = isSelf ? '본인' : document.getElementById('relation').value;
  const isLunar = document.querySelector('input[name="isLunar"]:checked').value === 'true';
  const isIntercalation = isLunar && document.getElementById('isIntercalation').checked;

  if (!name || !year || !month || !day) {
    errMsg.textContent = '이름과 생년월일을 모두 입력해주세요.';
    errMsg.style.display = 'block';
    submitBtn.disabled = false;
    submitBtn.textContent = editingProfile ? '수정' : '저장';
    return;
  }

  const birthDate = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
  const profileData = { relation, name, birth_date: birthDate, is_lunar: isLunar, is_intercalation: isIntercalation, gender };

  const sb = await getSb();
  const { data, error } = editingProfile
    ? await sb.from('profiles').update(profileData).eq('id', editingProfile.id).eq('member_id', session.user.id).select().single()
    : await sb.from('profiles').insert({ ...profileData, member_id: session.user.id, app_key: 'numerology-tarot' }).select().single();

  if (error) {
    console.error(error);
    if (String(error.message || '').includes('upgrade_required')) {
      errMsg.textContent = '가족/친구 추가는 유료 전환 후 이용하실 수 있어요.';
      errMsg.style.display = 'block';
      setTimeout(() => window.location.href = '/subscribe.html', 1200);
    } else {
      errMsg.textContent = '저장에 실패했어요. 다시 시도해주세요.';
      errMsg.style.display = 'block';
    }
    submitBtn.disabled = false;
    submitBtn.textContent = editingProfile ? '수정' : '저장';
    return;
  }

  showToast(editingProfile ? '프로필을 수정했어요 ✓' : '프로필을 저장했어요 ✓');
  window.location.href = `/result.html?id=${data.id}`;
});
</script>
</body>
</html>
