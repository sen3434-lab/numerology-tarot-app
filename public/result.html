<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OZ 넘버스 타로 · 결과</title>
<link rel="stylesheet" href="/css/style.css"/>
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#bc6338"/>
<style>
  .profile-head { text-align: center; padding: 4px 0 10px; }
  .profile-head .name { font-size: 19px; font-weight: 600; }
  .profile-head .meta { font-size: 12px; color: var(--muted-foreground); margin-top: 4px; }
  .profile-head #editLink { display: inline-block; margin-top: 8px; }

  .aspect-block { border: 0.8px solid var(--border); border-radius: 18px; padding: 20px; background: var(--card); margin-top: 18px; }
  .aspect-block-head { display: flex; align-items: center; gap: 12px; }
  .card-thumb { width: 46px; aspect-ratio: 3/5; object-fit: cover; border-radius: 6px; flex-shrink: 0; box-shadow: 0 2px 6px rgba(40,30,20,.18); background: var(--muted); }
  .card-num-wrap { flex-shrink: 0; text-align: center; }
  .card-num-wrap .card-num { width: 40px; height: 40px; border-radius: 50%; background: var(--secondary); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; }
  .card-num-wrap .card-num-label { font-size: 9.5px; color: var(--muted-foreground); margin-top: 3px; }
  .aspect-block-head .head-text { min-width: 0; }
  .aspect-block .aspect-label { font-size: 10.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--primary-dark); font-weight: 600; }
  .aspect-block .card-title { font-size: 16px; font-weight: 600; margin-top: 2px; }
  .aspect-block .card-name { font-size: 11.5px; color: var(--muted-foreground); margin-top: 2px; }

  .trait-list { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
  .trait-item { display: flex; gap: 12px; }
  .trait-item .trait-tag {
    flex-shrink: 0; width: 56px; text-align: center; align-self: flex-start;
    font-size: 11.5px; font-weight: 600; color: var(--accent-foreground);
    background: var(--accent); border-radius: var(--radius-pill); padding: 4px 0;
  }
  .trait-item p { font-size: 13px; line-height: 1.7; }
</style>
</head>
<body>

<div class="topbar">
  <a href="/index.html" class="brand">OZ <span>✦</span> 넘버스 타로</a>
  <div class="topbar-actions"></div>
</div>

<div class="container">
  <a href="/index.html" class="small muted">← 프로필 목록</a>

  <div id="loadingView" class="center" style="padding:60px 0;">
    <div class="spinner"></div>
  </div>

  <div id="content" style="display:none;">
    <div class="profile-head">
      <div class="name" id="profileName"></div>
      <div class="meta" id="profileMeta"></div>
      <a class="small muted" id="editLink" href="#">✎ 정보 수정</a>
    </div>

    <div id="extBlock"></div>
    <div id="intBlock"></div>

    <div class="upsell-box" id="upsellBox" style="display:none;">
      <div class="ic">✨</div>
      <p><strong>지금은 0~9번 카드까지만 보여드려요.</strong><br/>유료 전환 시 0~21번 전체 메이저 아르카나로 더 정밀하게 분석해드려요.</p>
      <a href="/subscribe.html" class="btn btn-primary mt-16">유료로 더 자세히 보기</a>
    </div>
  </div>
</div>

<script type="module">
import { requireAuth, getMember, getSb, isPaidTier, renderBottomNav, fmtDate, renderHighlighted } from '/js/app.js';
import { computeProfileNumbers } from '/js/numerology.js';
renderBottomNav('/index.html');

const params = new URLSearchParams(location.search);
const profileId = params.get('id');

// The four trait fields are pre-generated (once, offline, via
// data/generate_content.js) and stored in the DB — so the same card+aspect
// always reads identically, instead of a fresh (and inconsistent) AI call
// on every page view.
async function fetchInterpretation(sb, arcanaNumber, aspect) {
  const { data } = await sb
    .from('numerology_interpretations')
    .select('*, tarot_card:tarot_cards(name, image_url)')
    .eq('arcana_number', arcanaNumber)
    .eq('aspect', aspect)
    .maybeSingle();
  return data;
}

// Card artwork comes from the shared 'Universal Waite' deck (already
// uploaded for other ozma apps), not from our own '넘버타로' tarot_cards
// rows (those have no images). card_num there is 1-indexed (Fool = 1),
// while our arcana_number is 0-indexed (Fool = 0), hence the +1.
async function fetchCardImage(sb, arcanaNumber) {
  const { data } = await sb
    .from('tarot_cards')
    .select('image_url')
    .eq('card_type', 'Universal Waite')
    .eq('card_num', arcanaNumber + 1)
    .maybeSingle();
  return data?.image_url || null;
}

const TRAIT_ROWS = [
  ['personality_text', '성향'],
  ['wealth_text', '재물운'],
  ['love_text', '애정운'],
  ['health_text', '건강운'],
];
const PLACEHOLDER = '아직 이 카드의 해설이 등록되지 않았어요.';

function renderAspectBlock(container, { label, num, cardName, imageUrl, data }) {
  const traitsHtml = TRAIT_ROWS.map(([field, tag]) => `
    <div class="trait-item">
      <span class="trait-tag">${tag}</span>
      <p>${renderHighlighted(data?.[field]) || PLACEHOLDER}</p>
    </div>
  `).join('');

  container.innerHTML = `
    <div class="aspect-block">
      <div class="aspect-block-head">
        ${imageUrl ? `<img class="card-thumb" src="${imageUrl}" alt="${cardName || ''}"/>` : ''}
        <div class="card-num-wrap">
          <div class="card-num">${num}</div>
          <div class="card-num-label">소울넘버</div>
        </div>
        <div class="head-text">
          <div class="aspect-label">${label}</div>
          <div class="card-title">${renderHighlighted(data?.title) || cardName || '(준비 중인 카드예요)'}</div>
          <div class="card-name">${cardName || ''}</div>
        </div>
      </div>
      <div class="trait-list">${traitsHtml}</div>
    </div>
  `;
}

async function init() {
  const session = await requireAuth();
  if (!session) return;
  if (!profileId) {
    window.location.href = '/index.html';
    return;
  }

  const member = await getMember(session);
  if (!member) return;
  const paid = isPaidTier(member);

  const sb = await getSb();
  const { data: profile, error } = await sb
    .from('profiles')
    .select('*')
    .eq('id', profileId)
    .eq('member_id', session.user.id)
    .maybeSingle();

  if (error || !profile) {
    console.error(error);
    document.getElementById('loadingView').innerHTML = '<p class="muted small center">프로필을 찾을 수 없어요.</p>';
    return;
  }

  document.getElementById('profileName').textContent = profile.name;
  document.getElementById('profileMeta').textContent = `${profile.relation} · ${fmtDate(profile.birth_date)} (${profile.is_lunar ? '음력' : '양력'}${profile.is_intercalation ? ' 윤달' : ''}) · ${profile.gender || ''}`;
  document.getElementById('editLink').href = `/profile-form.html?id=${profile.id}`;

  const { externalNumber, internalNumber } = computeProfileNumbers(profile, paid);
  const conversionFailed = externalNumber === null || internalNumber === null;

  if (conversionFailed) {
    const failMsg = {
      personality_text: '이 생년월일은 음력↔양력 변환 지원 범위(1000~2050년)를 벗어나요.',
      wealth_text: '', love_text: '', health_text: '',
    };
    renderAspectBlock(document.getElementById('extBlock'), { label: '외적 성향 · 양력', num: '-', cardName: '변환 불가', data: failMsg });
    renderAspectBlock(document.getElementById('intBlock'), { label: '내적 성향 · 음력', num: '-', cardName: '변환 불가', data: failMsg });
  } else {
    const [extData, intData, extImage, intImage] = await Promise.all([
      fetchInterpretation(sb, externalNumber, 'external'),
      fetchInterpretation(sb, internalNumber, 'internal'),
      fetchCardImage(sb, externalNumber),
      fetchCardImage(sb, internalNumber),
    ]);

    renderAspectBlock(document.getElementById('extBlock'), {
      label: '외적 성향 · 양력',
      num: externalNumber,
      cardName: extData?.tarot_card?.name,
      imageUrl: extImage,
      data: extData,
    });

    renderAspectBlock(document.getElementById('intBlock'), {
      label: '내적 성향 · 음력',
      num: internalNumber,
      cardName: intData?.tarot_card?.name,
      imageUrl: intImage,
      data: intData,
    });
  }

  if (!paid) {
    document.getElementById('upsellBox').style.display = 'block';
  }

  document.getElementById('loadingView').style.display = 'none';
  document.getElementById('content').style.display = 'block';
}
init();
</script>
</body>
</html>
