<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OZ 넘버스 타로 · 결과</title>
<link rel="stylesheet" href="/css/style.css"/>
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#bc6338"/>
<link rel="icon" href="/icons/icon-192.png"/>
<link rel="apple-touch-icon" href="/icons/icon-192.png"/>
<style>
  .profile-head { text-align: center; padding: 4px 0 10px; }
  .profile-head .name { font-size: 19px; font-weight: 600; }
  .profile-head .meta { font-size: 12px; color: var(--muted-foreground); margin-top: 4px; }
  .profile-head #editLink { display: inline-block; margin-top: 8px; }

  .aspect-block { border: 0.8px solid var(--border); border-radius: 18px; padding: 20px; background: var(--card); margin-top: 18px; }
  .aspect-block-head { display: flex; align-items: center; gap: 12px; }
  .card-thumb { width: 46px; aspect-ratio: 3/5; object-fit: cover; border-radius: 6px; flex-shrink: 0; box-shadow: 0 2px 6px rgba(40,30,20,.18); background: var(--muted); }
  .card-num-wrap { flex-shrink: 0; text-align: center; }
  .card-num-wrap .card-num { width: 40px; height: 40px; border-radius: 50%; background: var(--secondary); display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; }
  .card-num-wrap .card-num-label { font-size: 9.5px; color: var(--muted-foreground); margin-top: 3px; }
  .aspect-block-head .head-text { min-width: 0; }
  .aspect-block .aspect-label { font-size: 10.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--primary-dark); font-weight: 600; }
  .aspect-block .card-title { font-size: 16px; font-weight: 600; margin-top: 2px; }
  .aspect-block .card-name { font-size: 11.5px; color: var(--muted-foreground); margin-top: 2px; }

  .trait-list { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
  .trait-item { display: flex; gap: 12px; }
  .trait-item .trait-tag {
    flex-shrink: 0; width: 56px; text-align: center; align-self: flex-start;
    font-size: 11.5px; font-weight: 600; color: var(--accent-foreground);
    background: var(--accent); border-radius: var(--radius-pill); padding: 4px 0;
  }
  .trait-item p { font-size: 13px; line-height: 1.7; }
</style>
</head>
<body>

<div class="topbar">
  <a href="/index.html" class="brand">OZ <span>✦</span> 넘버스 타로</a>
  <div class="topbar-actions">
    <a href="/coins.html" class="badge badge-free" id="coinBadge">🪙</a>
  </div>
</div>

<div class="container">
  <a href="/index.html" class="small muted">← 프로필 목록</a>

  <div id="loadingView" class="center" style="padding:60px 0;">
    <div class="spinner"></div>
  </div>

  <div id="content" style="display:none;">
    <div class="profile-head">
      <div class="name" id="profileName"></div>
      <div class="meta" id="profileMeta"></div>
      <a class="small muted" id="editLink" href="#">✎ 정보 수정</a>
    </div>

    <div id="extBlock"></div>
    <div id="intBlock"></div>

    <div id="gateBox" class="gate-box" style="display:none;"></div>
    <p class="small muted center mt-16" id="unlockedNote" style="display:none;">열어본 해설은 언제든 다시 볼 수 있어요 (무료)</p>
  </div>
</div>

<script type="module">
import { requireAuth, getMember, getSb, renderBottomNav, fmtDate, claimFreeCoins, getBalance, getPrice, getCardTeaser } from '/js/app.js';
import { computeProfileNumbers } from '/js/numerology.js';
import { renderAspectBlock } from '/js/aspect.js';
renderBottomNav('/index.html');

const params = new URLSearchParams(location.search);
const profileId = params.get('id');

const coinBadge = document.getElementById('coinBadge');
const gateBox = document.getElementById('gateBox');
const extBlock = document.getElementById('extBlock');
const intBlock = document.getElementById('intBlock');

let balance = 0;
let price = 1;
let profile = null;
let ext = null;
let int = null;
let extTeaser = null;
let intTeaser = null;

function updateCoinBadge() {
  coinBadge.textContent = `🪙 ${balance}`;
}

const EXT = { label: '외적 성향 · 양력' };
const INT = { label: '내적 성향 · 음력' };

function showLocked() {
  renderAspectBlock(extBlock, { ...EXT, num: ext, cardName: extTeaser.name, imageUrl: extTeaser.imageUrl, locked: true });
  renderAspectBlock(intBlock, { ...INT, num: int, cardName: intTeaser.name, imageUrl: intTeaser.imageUrl, locked: true });
}

function showUnlocked(res) {
  renderAspectBlock(extBlock, { ...EXT, num: ext, cardName: res.external?.card_name || extTeaser.name, imageUrl: extTeaser.imageUrl, data: res.external });
  renderAspectBlock(intBlock, { ...INT, num: int, cardName: res.internal?.card_name || intTeaser.name, imageUrl: intTeaser.imageUrl, data: res.internal });
  gateBox.style.display = 'none';
  document.getElementById('unlockedNote').style.display = 'block';
}

// The soul numbers and cards are free to see; the written reading is coins.
function renderGate(note) {
  gateBox.style.display = 'block';
  if (balance >= price) {
    gateBox.innerHTML = `
      <div class="gate-ic">🔓</div>
      <p><strong>코인 ${price}개로 ${profile.name}님의 해설을 열어볼까요?</strong></p>
      <p class="muted small mt-8">지금 보유 <b>${balance}코인</b> · 한 번 열면 언제든 다시 볼 수 있어요</p>
      ${note ? `<p class="gate-err">${note}</p>` : ''}
      <button class="btn btn-primary btn-block mt-16" id="unlockBtn">해설 열기 (${price}코인)</button>`;
    document.getElementById('unlockBtn').addEventListener('click', unlock);
  } else {
    gateBox.innerHTML = `
      <div class="gate-ic">🪙</div>
      <p><strong>코인이 부족해요</strong></p>
      <p class="muted small mt-8">보유 ${balance}코인 · 해설을 열려면 ${price}코인이 필요해요<br/>충전하시거나, 내일 출석 보너스 1코인을 받아가세요.</p>
      <a href="/coins.html" class="btn btn-primary btn-block mt-16">코인 충전하기</a>`;
  }
}

async function unlock() {
  const btn = document.getElementById('unlockBtn');
  btn.disabled = true;
  btn.textContent = '여는 중...';
  const sb = await getSb();
  const { data, error } = await sb.rpc('numerology_unlock_result', { p_profile_id: Number(profile.id), p_ext: ext, p_int: int });
  if (error || !data) {
    console.error(error);
    renderGate('지금은 열지 못했어요. 코인은 차감되지 않았어요. 잠시 후 다시 시도해주세요.');
    return;
  }
  if (!data.ok) {
    if (typeof data.balance === 'number') { balance = data.balance; updateCoinBadge(); }
    renderGate(data.reason === 'insufficient_coins' ? '' : '지금은 열 수 없어요. 코인은 차감되지 않았어요.');
    return;
  }
  balance = data.balance ?? balance;
  updateCoinBadge();
  showUnlocked(data);
}

async function init() {
  const session = await requireAuth();
  if (!session) return;
  if (!profileId) {
    window.location.href = '/index.html';
    return;
  }

  const member = await getMember(session);
  if (!member) return;
  const claimed = await claimFreeCoins(session);
  balance = claimed ?? await getBalance();
  price = await getPrice('result');
  updateCoinBadge();

  const sb = await getSb();
  const { data, error } = await sb
    .from('profiles')
    .select('*')
    .eq('id', profileId)
    .eq('member_id', session.user.id)
    .maybeSingle();

  if (error || !data) {
    console.error(error);
    document.getElementById('loadingView').innerHTML = '<p class="muted small center">프로필을 찾을 수 없어요.</p>';
    return;
  }
  profile = data;

  document.getElementById('profileName').textContent = profile.name;
  document.getElementById('profileMeta').textContent = `${profile.relation} · ${fmtDate(profile.birth_date)} (${profile.is_lunar ? '음력' : '양력'}${profile.is_intercalation ? ' 윤달' : ''}) · ${profile.gender || ''}`;
  document.getElementById('editLink').href = `/profile-form.html?id=${profile.id}`;

  // Everyone is read on the full 21-card scale.
  const numbers = computeProfileNumbers(profile, true);
  ext = numbers.externalNumber;
  int = numbers.internalNumber;

  if (ext === null || int === null) {
    const failMsg = {
      personality_text: '이 생년월일은 음력↔양력 변환 지원 범위(1000~2050년)를 벗어나요.',
      wealth_text: '', love_text: '', health_text: '',
    };
    renderAspectBlock(extBlock, { ...EXT, num: '-', cardName: '변환 불가', data: failMsg });
    renderAspectBlock(intBlock, { ...INT, num: '-', cardName: '변환 불가', data: failMsg });
  } else {
    [extTeaser, intTeaser] = await Promise.all([getCardTeaser(ext), getCardTeaser(int)]);

    // Already opened before? Show it again for free. Otherwise lock it.
    const { data: peek } = await sb.rpc('numerology_peek_result', { p_profile_id: Number(profile.id), p_ext: ext, p_int: int });
    if (peek?.ok) {
      showUnlocked(peek);
    } else {
      showLocked();
      renderGate();
    }
  }

  document.getElementById('loadingView').style.display = 'none';
  document.getElementById('content').style.display = 'block';
}
init();
</script>
</body>
</html>
